name: Deploy GAS Backend

on:
  push:
    branches:
      - main
    paths:
      - "gas/**"
      - ".clasp.json"
      - ".github/workflows/deploy-gas.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate clasp
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to GAS
        run: clasp push --force

      - name: Update production web app
        run: clasp deploy --deploymentId AKfycbwwOzhR410RuhM3RuXx8MLvIcVRqGFtqzlcWQhiATv419fxnS2079eaF0AlUf1N6cPd5A --description "Production ${{ github.sha }}"
